name: Build and Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Hemera (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Hemera Release
        run: cmake --build build --config Release

      - name: Package Release ZIP Bundle
        shell: pwsh
        run: |
          $ver = if ("${{ github.ref_name }}") { "${{ github.ref_name }}" } else { "latest" }
          $zipName = "Hemera-${ver}-windows-x64.zip"
          Compress-Archive -Path "build/Release/Hemera.exe", "build/Release/wintun.dll" -DestinationPath $zipName
          echo "RELEASE_ZIP=$zipName" >> $env:GITHUB_ENV

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hemera-Windows-x64
          path: |
            build/Release/Hemera.exe
            build/Release/wintun.dll
            *.zip
          if-no-files-found: warn

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.RELEASE_ZIP }}
            build/Release/Hemera.exe
            build/Release/wintun.dll
          name: Hemera ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
