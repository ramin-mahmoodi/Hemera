name: Build and Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Hemera (${{ matrix.target }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            msvc_arch: x64
            target: windows-x64
          - arch: arm64
            msvc_arch: x64_arm64
            target: windows-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC developer environment (${{ matrix.target }})
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Build ARM64 vendor libraries
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          ./scripts/build_vendor_arm64.ps1

      - name: Configure CMake (x64)
        if: matrix.arch == 'x64'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Configure CMake (ARM64)
        if: matrix.arch == 'arm64'
        run: cmake -B build -G "Visual Studio 17 2022" -A ARM64 -DCMAKE_BUILD_TYPE=Release

      - name: Build Hemera Release
        run: cmake --build build --config Release

      - name: Package Release ZIP Bundle
        shell: pwsh
        run: |
          $ver = if ("${{ github.ref_name }}") { "${{ github.ref_name }}" } else { "latest" }
          $zipName = "Hemera-${ver}-${{ matrix.target }}.zip"
          Compress-Archive -Path "build/Release/Hemera.exe", "build/Release/wintun.dll" -DestinationPath $zipName
          echo "RELEASE_ZIP=$zipName" >> $env:GITHUB_ENV

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hemera-${{ matrix.target }}
          path: |
            build/Release/Hemera.exe
            build/Release/wintun.dll
            *.zip
          if-no-files-found: warn

      - name: Upload Release Asset
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.RELEASE_ZIP }}
          name: Hemera ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
